<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌠%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://etech-symantec.github.io/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<meta charset="UTF-8">
<title>ProxySG Sysinfo 분석</title>
<style>
  /* ===================================================================
     Theme tokens — navy ink + a single brass accent
     =================================================================== */
  :root {
    --ink: #12263f;
    --navy: #1e3a5f;
    --navy-2: #2a4a73;
    --mist: #eef1f6;
    --paper: #ffffff;
    --line: #dde3ec;
    --line-soft: #e9edf3;
    --text: #1c2a3d;
    --muted: #6a7789;
    --brass: #a9854c;
    --brass-soft: #f6efe3;
    --shadow: 0 1px 2px rgba(18,38,63,.05), 0 12px 28px -16px rgba(18,38,63,.22);
  }
  body {
    background: var(--mist);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* === 리포트 섹션 / 표 === */
  .section {
    background: var(--paper);
    margin: 18px 0;
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow-x: auto;
  }
  .section-header {
    background: var(--ink);
    color: #f3f5f9;
    padding: 11px 18px;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: .01em;
    box-shadow: inset 0 -1px 0 rgba(169,133,76,.85);
  }
  table { width: 100%; border-collapse: collapse; }
  th, td {
    border: 1px solid var(--line-soft);
    padding: 8px 12px;
    text-align: center;
    font-size: 13px;
  }
  th {
    background: #f4f6fa;
    color: #2b3b52;
    font-weight: 600;
    font-size: 12.5px;
    border-color: var(--line);
  }
  .nok    { background-color: #fbe4e4; }   /* 빨간색 배경 */
  .yellow { background-color: #fdf3d3; }   /* 노란색 */
  .red    { background-color: #f9dcdf; }   /* 빨간색 */
  .white  { background-color: #f3f5f9; }   /* 기본 흰색 */

  /* === 파일 업로드 패널 === */
  .upload-panel {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 18px 20px 20px;
    margin: 18px 0 8px;
  }
  .upload-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px 16px;
    flex-wrap: wrap;
  }
  .upload-pick {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }
  /* 실제 input은 화면에서 숨기고(키보드 포커스는 유지), label을 버튼처럼 보이게 한다 */
  .upload-pick input[type=file] {
    position: absolute;
    width: 1px; height: 1px;
    margin: 0; padding: 0;
    opacity: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .file-btn {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 10px 18px;
    background: var(--ink);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 8px 16px -10px rgba(18,38,63,.7);
    transition: background-color .15s ease, transform .15s ease;
  }
  .file-btn:hover { background: var(--navy-2); }
  .file-btn:active { transform: translateY(1px); }
  .file-btn svg { width: 18px; height: 18px; flex: none; }
  .upload-pick input[type=file]:focus-visible + .file-btn {
    outline: 2px solid var(--brass);
    outline-offset: 3px;
  }
  .file-hint {
    font-size: 13px;
    color: var(--muted);
    max-width: 46vw;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #downloadBtn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    padding: 9px 16px;
    background: transparent;
    color: var(--navy);
    border: 1px solid #c5cedb;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    transition: background-color .15s ease, border-color .15s ease;
  }
  #downloadBtn:hover { background: #f2f5f9; border-color: var(--navy); }
  #downloadBtn svg { width: 16px; height: 16px; flex: none; }

  /* 🧲 드래그 앤 드롭 영역 */
  #dropZone {
    margin-top: 16px;
    min-height: 132px;
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
    color: var(--navy);
    background: #f7f9fc;
    border: 1.5px dashed #b7c2d3;
    border-radius: 14px;
    cursor: pointer;
    transition: border-color .18s ease, background-color .18s ease, box-shadow .18s ease;
  }
  #dropZone:hover { border-color: var(--navy-2); background: #f2f6fb; }
  #dropZone:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
  #dropZone.dragover {
    border-style: solid;
    border-color: var(--brass);
    background: var(--brass-soft);
    color: var(--ink);
    box-shadow: 0 0 0 4px rgba(169,133,76,.16);
  }
  #dropZone .dz-icon { width: 36px; height: 36px; margin-bottom: 4px; transition: transform .18s ease; }
  #dropZone.dragover .dz-icon { transform: translateY(-3px); }
  #dropZone .dz-title { font-size: 15px; font-weight: 600; color: var(--ink); }
  #dropZone .dz-sub { font-size: 12.5px; color: var(--muted); }

  /* === 첫 화면 안내 문구 === */
  .notice {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 56px auto 80px;
  }
  .notice-box {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 26px 18px 20px;
    max-width: 640px;
    box-shadow: var(--shadow);
  }
  .notice-icon {
    display: grid;
    place-items: center;
    flex: none;
    width: 44px; height: 44px;
    margin: 0;
    border-radius: 12px;
    background: #eaf0f8;
    color: var(--navy);
    font-size: 20px;
  }
  .notice-text { font-size: 13.5px; line-height: 1.75; color: #33425a; }
  .notice-text b, .notice-text strong { color: var(--ink); }

  /* === 모달 트리거 버튼 === */
  #openModal {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: #2563eb;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    z-index: 1001;
  }
  
  #openModal:hover { background: #1e40af; }

  /* === 모달 오버레이 === */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(2px);
    z-index: 999;
    justify-content: center;
    align-items: center;
  }

  /* === 모달 본체 === */
  .modal {
    background: white;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    width: 90%;
    max-width: 940px;
    max-height: 90%;
    overflow-y: auto;
    position: relative;
    animation: fadeIn .3s ease;
  }

  .close-btn {
    position: absolute;
    top: 8px;
    right: 14px;
    background: transparent;
    color: #444;
    font-size: 28px;
    border: none;
    cursor: pointer;
    z-index: 1000;
  }
  .close-btn:hover { color: #000; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* === 기존 Sysinfo curl UI 스타일 (간소화 버전) === */
  .container {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    margin: 30px;
    padding: 28px 32px;
  }
  
  h2 {
    margin: 0 0 18px 0;
    font-size: 20px;
    color: #1e3a8a;
    border-bottom: 2px solid #e0e7ff;
    padding-bottom: 6px;
  }
  
  label { font-weight: 600; font-size: 13px; color: #374151; display: block; }
  input[type="text"], input[type="password"], textarea {
    padding: 9px 10px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 14px;
    background-color: #fafafa;
  }
  
  input:focus, textarea:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 2px rgba(37,99,235,0.2);
    background-color: #fff;
  }
  
  .input-row {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  
  .w-sm { width: 100px; }
  .w-md { width: 140px; }
  textarea { width: 90%; min-height: 80px; resize: vertical; }
  pre {
    background: #0f172a;
    color: #e2e8f0;
    padding: 12px;
    border-radius: 10px;
    min-height: 120px;
    white-space: pre-wrap;
    overflow-x: auto;
    margin-top: 10px;
  }
  
  button {
    background: #2563eb;
    border: none;
    color: #fff;
    padding: 9px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
  }
  
  button:hover { background: #1e40af; }
  .actions { margin-top: 12px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .note { font-size: 13px; color: #1e3a8a; background: #eff6ff; border: 1px solid #bfdbfe; padding: 6px 10px; border-radius: 6px; }
  .badge { background: #e0e7ff; color: #1e3a8a; font-size: 12px; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
  
  /* === 리포트 2단 레이아웃: 왼편=기존 정보(① ~ ④), 오른편=신규 정보(⑤ ~ ⑥) === */
  .report-columns {
    display: grid;
    grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
    gap: 16px;
    align-items: start;
  }
  .report-columns .col-left,
  .report-columns .col-right {
    min-width: 0;          /* 표/그래프가 칼럼 밖으로 삐져나오지 않도록 */
    overflow-x: auto;      /* 좁은 칼럼에서는 칼럼 안에서 가로 스크롤 */
    padding: 4px 8px 18px;
  }
  @media (max-width: 1100px) {
    .report-columns { grid-template-columns: minmax(0, 1fr); }
  }

  /* === 공통 버튼 / 플로팅 버튼 / 모달 다듬기 === */
  button { background: var(--ink); border-radius: 10px; }
  button:hover { background: var(--navy-2); }
  #openModal {
    background: var(--ink);
    border-radius: 999px;
    padding: 11px 20px;
    font-size: 13.5px;
    letter-spacing: .01em;
    box-shadow: 0 1px 2px rgba(18,38,63,.2), 0 14px 26px -12px rgba(18,38,63,.55);
    transition: background-color .15s ease, transform .15s ease;
  }
  #openModal:hover { background: var(--navy-2); transform: translateY(-1px); }
  .modal-overlay { background: rgba(14,28,46,.5); backdrop-filter: blur(3px); }
  .modal { border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 24px 60px -20px rgba(14,28,46,.55); }
  .container { box-shadow: none; }
  h2 { color: var(--ink); border-bottom: 1px solid var(--line); }
  .badge { background: var(--brass-soft); color: #7a5d2c; }
  .note { color: var(--navy); background: #eef3fa; border-color: #d3deee; }
  input:focus, textarea:focus {
    border-color: var(--navy-2);
    box-shadow: 0 0 0 3px rgba(30,58,95,.16);
  }

  /* === ⑤ ⑥ 파일별 카드(details) === */
  .diag {
    margin: 12px 0;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .diag > summary {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    cursor: pointer;
    list-style: none;
    font-weight: 600;
    color: var(--ink);
  }
  .diag > summary::-webkit-details-marker { display: none; }
  .diag > summary::before {
    content: "";
    flex: none;
    width: 7px; height: 7px;
    border-right: 2px solid var(--brass);
    border-bottom: 2px solid var(--brass);
    transform: rotate(-45deg);
    transition: transform .18s ease;
  }
  .diag[open] > summary { border-bottom: 1px solid var(--line-soft); }
  .diag[open] > summary::before { transform: rotate(45deg); }
  .diag-body { padding: 2px 16px 16px; }
  .diag-h { margin: 18px 0 8px; font-size: 13.5px; font-weight: 600; color: var(--navy); }

  @media (max-width: 640px) {
    .upload-head { flex-direction: column; align-items: stretch; }
    .file-hint { max-width: 100%; }
    #downloadBtn { justify-content: center; }
  }

  /* === ⑦ 원본 Sysinfo 밑줄 구분선 + 제목 구간 보기 === */
  .raw-sections-wrap {
    padding: 12px 14px 16px;
  }
  .raw-file {
    margin: 12px 0;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .raw-file > summary {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    cursor: pointer;
    list-style: none;
    font-weight: 600;
    color: var(--ink);
    background: #f8fafc;
  }
  .raw-file > summary::-webkit-details-marker,
  .raw-block > summary::-webkit-details-marker { display: none; }
  .raw-file > summary::before,
  .raw-block > summary::before {
    content: "";
    flex: none;
    width: 7px;
    height: 7px;
    border-right: 2px solid var(--brass);
    border-bottom: 2px solid var(--brass);
    transform: rotate(-45deg);
    transition: transform .18s ease;
  }
  .raw-file[open] > summary::before,
  .raw-block[open] > summary::before { transform: rotate(45deg); }
  .raw-file-body { padding: 10px 12px 12px; }
  .raw-block {
    margin: 8px 0;
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
  }
  .raw-block > summary {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding: 10px 12px;
    cursor: pointer;
    list-style: none;
    color: var(--navy);
    font-size: 13px;
    font-weight: 600;
    word-break: break-all;
    background: #fbfcfe;
  }
  .raw-block[open] > summary { border-bottom: 1px solid var(--line-soft); }
  .raw-group-heading {
    margin: 14px 0 9px;
    padding: 0 2px;
    font-size: 13px;
    color: var(--navy);
    font-weight: 700;
  }
  .raw-main-block {
    border-color: #b8d1e2;
    box-shadow: inset 3px 0 0 #2f7385;
  }
  .raw-main-block > summary {
    background: #eaf4fa;
    color: #153d5c;
  }
  .raw-main-block > summary::after {
    content: "주요";
    margin-left: auto;
    flex: none;
    font-size: 11px;
    color: #24576f;
    background: #d0e6f3;
    border-radius: 999px;
    padding: 2px 8px;
  }
  .raw-other-block > summary { background: #fbfcfe; }
  .raw-group + .raw-group { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 8px; }
  .raw-block pre {
    margin: 0;
    min-height: 0;
    max-height: 520px;
    padding: 12px 14px;
    border-radius: 0;
    overflow: auto;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
    font-size: 12px;
    line-height: 1.55;
  }
  /* ⑦ 원본 구간 검색 */
  .raw-search-bar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 9px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    background: #f8fafc;
  }
  .raw-search-bar select {
    flex: 0 1 240px;
    min-width: 170px;
    max-width: 360px;
    padding: 9px 11px;
    border: 1px solid #b7c6d8;
    border-radius: 8px;
    color: var(--ink);
    background: #fff;
    font-size: 13px;
  }
  .raw-search-bar input {
    flex: 1 1 260px;
    min-width: 140px;
    max-width: 520px;
    padding: 9px 12px;
    border: 1px solid #b7c6d8;
    border-radius: 8px;
    color: var(--ink);
  }
  .raw-search-bar button { padding: 8px 12px; font-size: 12px; }
  .raw-search-bar button:disabled { opacity: .45; cursor: default; }
  .raw-search-info { font-size: 12px; color: var(--muted); }
  .raw-block.raw-match > summary { outline: 1px solid #c1a167; outline-offset: -1px; }
  .raw-block.raw-active-match > summary { background: #fff0ca; color: #5d4217; }
  .raw-line-count {
    display: inline-block;
    flex: none;
    margin-left: auto;
    color: var(--muted);
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
  }
  .raw-main-block > summary .raw-line-count { margin-left: 10px; }
  .raw-copy-button {
    flex: none;
    background: transparent;
    color: var(--navy);
    border: 1px solid #b9cadb;
    border-radius: 7px;
    padding: 5px 10px;
    margin-left: 8px;
    font-size: 11px;
    white-space: nowrap;
    cursor: pointer;
  }
  .raw-copy-button:hover, .raw-copy-button:focus-visible {
    color: #fff;
    background: var(--navy);
  }
  .raw-copy-button.copy-success { color: #17633a; border-color: #64ae83; background: #e6f7eb; }
  .raw-copy-button.copy-error { color: #8f2525; border-color: #e4a2a2; background: #fff0f0; }
  .raw-main-block > summary .raw-copy-button { margin-right: 0; }
  .raw-block mark { background: #ffda70; color: #17253a; border-radius: 2px; font-weight:700; }
  .raw-block mark.raw-current-hit { background:#ff9d38; outline:2px solid #ad5a14; }
  /* Software Configuration 상세 하위 구간 */
  .raw-subsection-panel {
    margin: 10px 12px 14px 26px;
    padding: 12px;
    background: #f6f9fc;
    border: 1px solid #cbd9e9;
    border-radius: 10px;
  }
  .raw-subsection-heading { font-weight: 700; color: var(--navy); font-size: 13px; margin-bottom: 8px; }
  .raw-subsection {
    border: 1px solid #d7e1ec;
    border-radius: 8px;
    margin: 7px 0;
    background: #fff;
    overflow: hidden;
  }
  .raw-subsection > summary {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    padding: 10px;
    font-size: 12px;
    color: var(--navy);
    font-weight: 600;
    list-style: none;
  }
  .raw-subsection > summary::-webkit-details-marker { display:none; }
  .raw-subsection > summary::before { content:"▸"; color:var(--brass); }
  .raw-subsection[open] > summary::before { content:"▾"; }
  .raw-subsection .raw-line-count { margin-left:auto; }
  .raw-subsection .raw-copy-button { margin-left:6px; }
  .raw-subsection .raw-block-content pre { max-height:520px; }
  .raw-page-toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; padding:9px 12px; background:#f4f7fb; border-top:1px solid var(--line); }
  .raw-page-toolbar button { padding:5px 10px; font-size:12px; }
  .raw-page-toolbar button:disabled { opacity:.45; cursor:default; }
  .raw-page-label { font-size:12px; color:var(--navy); }
  .raw-block-content[hidden] { display:none; }
  .raw-empty {
    padding: 14px 16px;
    color: var(--muted);
    font-size: 13px;
  }

  /* 업로드 / 분석 진행 상태 */
  #parseProgress {
    display: none;
    position: sticky;
    top: 8px;
    z-index: 25;
    margin: 12px 0;
    padding: 14px 18px;
    border: 1px solid #b7c6dd;
    border-radius: 12px;
    background: #f8fafc;
    box-shadow: var(--shadow);
    color: var(--ink);
  }
  #parseProgress.active { display: block; }
  .parse-progress-top { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-weight: 600; font-size: 13px; }
  .parse-progress-track { height: 9px; border-radius: 99px; overflow: hidden; background: #dfe6f0; margin: 10px 0 6px; }
  #parseProgressBar { width: 0%; height: 100%; background: #2f7385; transition: width .2s ease; }
  #parseProgressSub { font-size: 12px; color: var(--muted); }

  .upload-panel.compact #downloadBtn { order: 3; flex: none; }

  @media (max-width: 760px) {

  @media (prefers-reduced-motion: reduce) {

  }
</style>

<body>

<!-- 공통 헤더 + 제목 + 버전 -->
<script>
  window.pageTitle = "ProxySG Sysinfo 분석";
  window.pageVersion = "ver.2026.11.05.12";
</script> 
<script src="https://etech-symantec.github.io/header.js"></script>

<!-- 📂 파일 업로드 패널 -->
<div class="upload-panel">
  <div class="upload-head">
    <div class="upload-pick">
      <input type="file" id="fileInput" accept=".txt" multiple>
      <label for="fileInput" class="file-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.5h7.5A2.5 2.5 0 0 1 21 10v7.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg>
        <span>sysinfo 파일 선택</span>
      </label>
      <span id="fileHint" class="file-hint">선택된 파일 없음</span>
    </div>
    <button id="downloadBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="m7.5 11 4.5 4.5 4.5-4.5"/><path d="M5 19.5h14"/></svg>
      <span>현재 페이지를 HTML로 저장</span>

  </div>

  <!-- 🧲 드래그 앤 드롭 영역 -->
  <div id="dropZone" tabindex="0" role="button" aria-label="sysinfo 파일을 끌어다 놓거나 클릭해서 선택">
    <svg class="dz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="m7 8.5 5-5 5 5"/><path d="M4 15v2.5A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5V15"/></svg>
    <div class="dz-title">sysinfo 파일을 여기에 놓으세요</div>
    <div class="dz-sub">클릭해서 선택할 수도 있고, .txt 파일 여러 개를 한 번에 올릴 수 있습니다.</div>
  </div>
</div>



<!-- ✅ 안내 문구 (스타일 개선 버전) -->
<div id="notice" class="notice">
  <div class="notice-box">
    <span class="notice-icon">🔒</span>
    <div class="notice-text">
      이 페이지는 <b>로컬 환경</b>에서만 작동하며, 파일이 외부 서버로 전송되지 않습니다.</b><br>
      모든 처리는 <b>HTML 내부 스크립트</b>에서만 수행됩니다.
    </div>
  </div>
</div>

<div id="parseProgress" role="status" aria-live="polite" aria-atomic="true">
  <div class="parse-progress-top"><span id="parseProgressTitle">파일 준비 중...</span><span id="parseProgressPercent">0%</span></div>
  <div class="parse-progress-track" role="progressbar" aria-label="sysinfo 분석 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="parseProgressTrack"><div id="parseProgressBar"></div></div>
  <div id="parseProgressSub">대용량 파일 분석 중에는 잠시 시간이 걸릴 수 있습니다.</div>
</div>
<div id="report"></div>


<script>
    // 오늘 날짜 구하기 (yyyy. mm. dd. 형식)
    function formatDate(date) {
      const year = date.getFullYear();
      const month = (date.getMonth() + 1).toString().padStart(2, '0'); // 월은 0부터 시작하므로 +1
      const day = date.getDate().toString().padStart(2, '0'); // 날짜 두 자릿수로 맞추기
      return `${year}. ${month}. ${day}.`;
    }

    const today = new Date();
    const formattedDate = formatDate(today);

	
    
    //  날짜 차이 일수 계산기
	function getDateDiff(dateString) {
      const today = new Date();
      const date = new Date(dateString);

      // 날짜 차이 계산 (밀리초 단위)
      const timeDiff = date - today;

      // 날짜 차이를 일(day) 단위로 변환
      const diffInDays = Number(Math.floor(timeDiff / (1000 * 3600 * 24)));
      return diffInDays
      
    }

    // Chart.js로 실제 그래프를 그리는 함수. section6의 canvas들이 DOM에 삽입된 뒤에 호출해야 한다.
    function renderTrendCharts() {
      const list = window.__sysinfoTrendCharts || [];
      if (window.Chart && Chart.defaults) {
        Chart.defaults.color = "#51607a";
        Chart.defaults.borderColor = "#e6eaf1";
        Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
      }
      const fmtTick = (d) => {
        const mm = String(d.getUTCMonth() + 1).padStart(2, "0");
        const dd = String(d.getUTCDate()).padStart(2, "0");
        const hh = String(d.getUTCHours()).padStart(2, "0");
        const mi = String(d.getUTCMinutes()).padStart(2, "0");
        return `${mm}/${dd} ${hh}:${mi}`;
      };

      list.forEach(({ idx, cpuSeries, memSeries, netSentMbps, netRecvMbps }) => {
        // ── CPU/Memory 사용률(%) 차트 ──
        const cpuMemCanvas = document.getElementById(`chart-cpumem-${idx}`);
        if (cpuMemCanvas && (cpuSeries || memSeries)) {
          const labelSource = (cpuSeries && memSeries)
            ? (cpuSeries.values.length >= memSeries.values.length ? cpuSeries : memSeries)
            : (cpuSeries || memSeries);
          const n = labelSource.values.length;
          const labels = labelSource.timestamps.slice(-n).map(fmtTick);
          const datasets = [];
          if (cpuSeries) {
            datasets.push({
              label: "CPU 사용률(%)",
              data: cpuSeries.values.slice(-n),
              borderColor: "#1e3a5f",
              backgroundColor: "rgba(30,58,95,0.08)",
              tension: 0.25,
              pointRadius: 0,
              borderWidth: 2,
            });
          }
          if (memSeries) {
            datasets.push({
              label: "메모리 사용률(%)",
              data: memSeries.values.slice(-n),
              borderColor: "#2f8f83",
              backgroundColor: "rgba(47,143,131,0.08)",
              tension: 0.25,
              pointRadius: 0,
              borderWidth: 2,
            });
          }
          const chart = new Chart(cpuMemCanvas.getContext("2d"), {
            type: "line",
            data: { labels, datasets },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              interaction: { mode: "index", intersect: false },
              scales: {
                y: { min: 0, max: 100, title: { display: true, text: "사용률(%)" } },
                x: { ticks: { maxTicksLimit: 12, autoSkip: true } },
              },
              plugins: { legend: { position: "top" } },
            },
          });
          window.__sysinfoChartInstances.push(chart);
        }

        // ── 네트워크 Tx/Rx 처리량(Mbps) 차트 ──
        const netCanvas = document.getElementById(`chart-net-${idx}`);
        if (netCanvas && (netSentMbps || netRecvMbps)) {
          const labelSource = (netSentMbps && netRecvMbps)
            ? (netSentMbps.values.length >= netRecvMbps.values.length ? netSentMbps : netRecvMbps)
            : (netSentMbps || netRecvMbps);
          const n = labelSource.values.length;
          const labels = labelSource.timestamps.slice(-n).map(fmtTick);
          const datasets = [];
          if (netSentMbps) {
            datasets.push({
              label: "Tx (송신, Mbps)",
              data: netSentMbps.values.slice(-n).map(v => Number(v.toFixed(2))),
              borderColor: "#a9854c",
              backgroundColor: "rgba(169,133,76,0.10)",
              tension: 0.25,
              pointRadius: 0,
              borderWidth: 2,
            });
          }
          if (netRecvMbps) {
            datasets.push({
              label: "Rx (수신, Mbps)",
              data: netRecvMbps.values.slice(-n).map(v => Number(v.toFixed(2))),
              borderColor: "#6d5a9c",
              backgroundColor: "rgba(109,90,156,0.08)",
              tension: 0.25,
              pointRadius: 0,
              borderWidth: 2,
            });
          }
          const chart = new Chart(netCanvas.getContext("2d"), {
            type: "line",
            data: { labels, datasets },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              interaction: { mode: "index", intersect: false },
              scales: {
                y: { min: 0, title: { display: true, text: "Mbps" } },
                x: { ticks: { maxTicksLimit: 12, autoSkip: true } },
              },
              plugins: { legend: { position: "top" } },
            },
          });
          window.__sysinfoChartInstances.push(chart);
        }
      });
    }

    // ✅ 여러 파일 업로드 대응
    document.getElementById("fileInput").addEventListener("change", async function (e) {
    
      // ✅ 파일 업로드 시 안내 문구 제거
      document.getElementById("notice")?.remove();

    const files = Array.from(e.target.files);
    if (!files.length) return;
    const progress = document.getElementById("parseProgress");
    const progressTitle = document.getElementById("parseProgressTitle");
    const progressPercent = document.getElementById("parseProgressPercent");
    const progressBar = document.getElementById("parseProgressBar");
    const progressTrack = document.getElementById("parseProgressTrack");
    const progressSub = document.getElementById("parseProgressSub");
    const loadedBytes = new Array(files.length).fill(0);
    const parsed = new Array(files.length).fill(false);
    const totalBytes = files.reduce((sum, file) => sum + file.size, 0) || 1;
    const updateProgress = (title, sub) => {
      const readRatio = loadedBytes.reduce((sum, n) => sum + n, 0) / totalBytes;
      const parsedCount = parsed.filter(Boolean).length;
      // Reading = 0-60%, parsing = 60-95%, rendering = 95-100%
      const percent = Math.min(95, Math.floor(60 * readRatio + 35 * (parsedCount / files.length)));
      progressTitle.textContent = title;
      progressSub.textContent = sub || `파일 ${parsedCount}/${files.length}개 분석 완료`;
      progressPercent.textContent = percent + "%";
      progressBar.style.width = percent + "%";
      progressTrack.setAttribute("aria-valuenow", percent);
    };
    progress.classList.add("active");
    updateProgress("sysinfo 파일 읽는 중...", `${files.length}개 파일을 준비하고 있습니다.`);
    // 브라우저가 진행 상태를 먼저 표시할 기회를 준 다음 파일을 처리
    await new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 0)));
    
    // 상단 업로드 목록 표시
    const fileListHTML = files.map((f, i) => `<li>${i + 1}. ${f.name}</li>`).join("");
    document.getElementById("report").innerHTML = `
      <div class="report-columns">
        <div class="col-left" id="colLeft">
          <div class="section">
            <div class="section-header">📂 정리된 sysinfo 파일 목록 (${files.length}개)</div>
            <ul style="margin:17px 10px;">${fileListHTML}<br></ul>
          </div>
        </div>
        <div class="col-right" id="colRight"></div>
      </div>
      <div id="rawSections"></div>`;

    // 이전 업로드에서 그려둔 Chart.js 인스턴스/트렌드 데이터를 정리한다
    // (재업로드 시 같은 canvas id에 겹쳐 그려지거나 메모리 누수가 나는 것을 방지).
    if (window.__sysinfoChartInstances) {
      window.__sysinfoChartInstances.forEach(c => { try { c.destroy(); } catch (e) {} });
    }
    window.__sysinfoChartInstances = [];
    window.__sysinfoTrendCharts = [];
    window.__sysinfoRawContent = []; // 클릭한 구간에만 원문을 생성하여 대용량 렌더링 방지

    // Promise.all 로 모든 파일 처리
    const results = await Promise.all(
      files.map((file, fileIdx) => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onprogress = (ev) => {
            if (ev.lengthComputable) {
              loadedBytes[fileIdx] = Math.min(file.size, ev.loaded);
              updateProgress("sysinfo 파일 읽는 중...", `${file.name} 읽는 중 · ${Math.round(ev.loaded / Math.max(1, ev.total) * 100)}%`);
            }
          };
          reader.onerror = () => {
            loadedBytes[fileIdx] = file.size;
            parsed[fileIdx] = true;
            updateProgress("파일 처리 중...", `${file.name} 읽기 실패`);
            resolve({name:file.name, section1:"",section2:"",section3:"",section4:"",section5:"",section6:"",section7:`<div class="raw-empty">${file.name} 읽기에 실패했습니다.</div>`});
          };
          reader.onload = function (ev) {
            loadedBytes[fileIdx] = file.size;
            updateProgress("sysinfo 분석 중...", `${file.name} 내용을 분석하고 있습니다.`);
            // 무거운 분석에 앞서 화면에 단계 변경을 먼저 반영
            setTimeout(() => {
            const text = ev.target.result;
            const match = (r) => text.match(r)?.[1]?.trim() || "-";
            const oknok = (v) => (v.match(/NOK/i) ? 'class="nok"' : "");

            // 연속된 밑줄(10개 이상) 행 다음의 첫 비어 있지 않은 행을 제목으로 간주.
            // 원본 섹션은 다음 밑줄 행 직전까지 보존하며, 제목은 어떤 문자열이든 허용.
            const escapeHTML = (value) => String(value ?? "")
              .replace(/&/g, "&amp;").replace(/</g, "&lt;")
              .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
              .replace(/'/g, "&#39;");

            const splitUnderlineSections = (source) => {
              const lines = String(source ?? "").replace(/\r\n?/g, "\n").split("\n");
              const sections = [];
              const isSeparator = (line) => /^\s*_{10,}\s*$/.test(line);
              let sectionStart = -1;
              let title = "";
              for (let idx = 0; idx < lines.length; idx++) {
                if (!isSeparator(lines[idx])) continue;
                if (sectionStart >= 0) {
                  sections.push({title, lines: lines.slice(sectionStart, idx)});
                }
                sectionStart = idx;
                let titleIdx = idx + 1;
                while (titleIdx < lines.length && !lines[titleIdx].trim()) titleIdx++;
                title = titleIdx < lines.length && !isSeparator(lines[titleIdx])
                  ? lines[titleIdx].trim() : "제목 없는 구간";
              }
              if (sectionStart >= 0) sections.push({title, lines: lines.slice(sectionStart)});
              return sections;
            };
            const rawSections = splitUnderlineSections(text);
            const importantTitles = [
              "Version Information",
              "Hardware Information",
              "CPU Monitor",
              "Policy",
              "Policy Statistics",
              "Software Configuration",
              "HTTP Main",
              "Licensing Statistics",
              "Configuration Change Events",
              "Priority 1 Events",
              "Access Log Objects",
              "Forwarding Settings",
              "Forwarding Summary Statistics",
              "Content Filter Status",
              "Persistent Statistics",
              "Persistent Statistics Export Statistics"
            ];
            const normalizeSectionTitle = title => String(title ?? "")
              .trim().replace(/\\s+/g, " ").replace(/:+$/, "").trim().toLowerCase();
            const titleRank = new Map(importantTitles.map((title, idx) => [normalizeSectionTitle(title), idx]));
            const mainSections = [];
            const otherSections = [];
            rawSections.forEach((part, originalIndex) => {
              const rank = titleRank.get(normalizeSectionTitle(part.title));
              if (rank === undefined) otherSections.push({part, originalIndex});
              else mainSections.push({part, originalIndex, rank});
            });
            mainSections.sort((a, b) => a.rank - b.rank || a.originalIndex - b.originalIndex);

            // 파일별 캐시에는 텍스트 데이터만 보관. 접힌 항목의 <pre>는 만들지 않는다.
            const rawStore = window.__sysinfoRawContent;
            const registerRawBlock = (part) => {
              const id = rawStore.length;
              rawStore.push(part.lines.join("\n"));
              return id;
            };
            // 구분선/제목/빈 줄은 제외하고 원문 내용이 있는 줄만 계산한다.
            const countContentLines = part => {
              const lines = part.lines;
              const titleIndex = lines.findIndex((line, idx) =>
                idx > 0 && line.trim() === part.title);
              const content = lines.slice(titleIndex >= 0 ? titleIndex + 1 : 1);
              return content.reduce((count, line) => count + (line.trim() ? 1 : 0), 0);
            };
            // Software Configuration 내부의 inline 블록과 XML 블록을 정규식으로 분리.
            // end-123-inline-xml은 end-123-inline으로 인정하지 않으며,
            // inline 블록은 시작과 종료의 숫자가 같은 경우에만 정상 종료로 간주한다.
            const splitSoftwareDetails = (part) => {
              const source = part.lines.join("\n");
              const candidates = [];
              const inlineStart = /\binline\s+(exceptions|authentication-forms|policy\s+(?:central|local|vpm))\s+end-(\d+)-inline(?![-\w])/gi;
              let found;
              while ((found = inlineStart.exec(source))) {
                candidates.push({
                  index: found.index, afterStart: inlineStart.lastIndex,
                  label: "inline " + found[1].toLowerCase().replace(/\s+/g, " "),
                  id: found[2], type: "inline"
                });
              }
              const xmlStart = /^[ \t]*<\?xml\b/gmi;
              while ((found = xmlStart.exec(source))) {
                candidates.push({
                  index: found.index, afterStart: xmlStart.lastIndex,
                  label: "XML Configuration", type: "xml"
                });
              }
              candidates.sort((a, b) => a.index - b.index);
              const segments = [];
              let cursor = 0, order = 0;
              for (let i = 0; i < candidates.length; i++) {
                const start = candidates[i];
                if (start.index < cursor) continue;
                if (start.index > cursor && order === 0) {
                  const gap = source.slice(0, start.index);
                  if (gap.trim()) segments.push({title: "기본 설정 (첫 줄 ~ 상세 구간 전)", text: gap});
                  order = 1;
                }
                const nextStart = candidates.slice(i + 1).find(item => item.index > start.index);
                const boundary = nextStart ? nextStart.index : source.length;
                let closeAt = -1;
                if (start.type === "inline") {
                  const endRegex = new RegExp("\\bend-" + start.id + "-inline(?![-\\w])", "g");
                  endRegex.lastIndex = start.afterStart;
                  const endMatch = endRegex.exec(source);
                  if (endMatch && endMatch.index < boundary) closeAt = endRegex.lastIndex;
                } else {
                  const endRegex = /\bend-\d+-inline-xml(?![-\w])/g;
                  endRegex.lastIndex = start.afterStart;
                  const endMatch = endRegex.exec(source);
                  if (endMatch && endMatch.index < boundary) closeAt = endRegex.lastIndex;
                }
                // 종료 마커가 없을 때도 다음 시작 마커를 삼키지 않도록 분리한다.
                const finish = closeAt >= 0 ? closeAt : boundary;
                const segmentText = source.slice(start.index, finish);
                segments.push({
                  title: start.label + (start.id ? " (" + start.id + ")" : "") +
                    (closeAt < 0 ? " · 종료 마커 미확인" : ""),
                  text: segmentText
                });
                cursor = finish;
              }
              // 상세 구간 사이의 기타 설정은 목록에서 제외한다 (전체 내용에는 보존).
              if (!candidates.length && source.trim()) {
                segments.push({title: "기본 설정 (전체)", text: source});
              }
              return segments;
            };
            const renderSoftwareSubsections = part => {
              const pieces = [{title: "전체 내용", text: part.lines.join("\n")}, ...splitSoftwareDetails(part)];
              return `
                <div class="raw-subsection-panel">
                  <div class="raw-subsection-heading">Software Configuration 상세 구간 (${pieces.length}개)</div>
                  ${pieces.map((item, idx) => {
                    const id = rawStore.length;
                    rawStore.push(item.text);
                    const lineCount = item.text.split("\n").filter(line => line.trim()).length;
                    return `<details class="raw-subsection" data-raw-id="${id}">
                      <summary><span>${idx + 1}. ${escapeHTML(item.title)}</span>
                      <span class="raw-line-count">내용 ${lineCount.toLocaleString()}줄</span>
                      <button type="button" class="raw-copy-button" title="하위 구간 전체 원문 복사">전체 복사</button></summary>
                      <div class="raw-block-content" hidden></div>
                    </details>`;
                  }).join("")}
                </div>`;
            };
            const renderRawBlocks = (items, isImportant) => items.map(({part}, idx) => `
              <details class="raw-block ${isImportant ? "raw-main-block" : "raw-other-block"}" data-raw-id="${registerRawBlock(part)}" ${normalizeSectionTitle(part.title) === "software configuration" ? 'data-software-parent="1"' : ""}>
                <summary><span>${idx + 1}. ${escapeHTML(part.title)}</span><span class="raw-line-count">내용 ${countContentLines(part).toLocaleString()}줄</span><button type="button" class="raw-copy-button" aria-label="${escapeHTML(part.title)} 구간 전체 내용 복사" title="페이지 구분과 관계없이 구간 전체 원문 복사">전체 복사</button></summary>
                ${normalizeSectionTitle(part.title) === "software configuration"
                  ? renderSoftwareSubsections(part)
                  : '<div class="raw-block-content" hidden></div>'}
              </details>`).join("");

            const rawSectionsHTML = `
              <details class="raw-file" open>
                <summary>${escapeHTML(file.name)} · 전체 ${rawSections.length}개 구간 · 주요 ${mainSections.length}개</summary>
                <div class="raw-file-body">
                  ${rawSections.length ? `
                    <section class="raw-group">
                      <div class="raw-group-heading">★ 주요 항목 (${mainSections.length}개)</div>
                      ${mainSections.length ? renderRawBlocks(mainSections, true) : '<div class="raw-empty">해당 파일에서 지정된 주요 항목을 찾지 못했습니다.</div>'}
                    </section>
                    <section class="raw-group">
                      <div class="raw-group-heading">기타 항목 (${otherSections.length}개)</div>
                      ${otherSections.length ? renderRawBlocks(otherSections, false) : '<div class="raw-empty">기타 구간이 없습니다.</div>'}
                    </section>`
                  : '<div class="raw-empty">밑줄 구분선(__________)으로 시작하는 구간을 찾지 못했습니다.</div>'}
                </div>
              </details>`;

    // =======================================================================================
    // 0. sysinfo 파일 하나만으로 뽑아낼 수 있는 상세 진단 정보
    //    (CPU Monitor / HTTP Worker Statistics / TCP·IP Statistics / Access Log Statistics)
    //    ※ ping 모니터링, TCP Connections(8082 별도 페이지), CE/Statistics 디스크 캐시처럼
    //      장비에 실시간 접속해야 하는 정보는 sysinfo 파일만으로는 얻을 수 없어 제외했다.
    // =======================================================================================

    // ── CPU Monitor: 코어별 사용률 + 컴포넌트(프로세스 그룹)별 사용률 ──────────────
    function parseCpuMonitor(text) {
      const secMatch = text.match(/CPU Monitor:([\s\S]*?)_{10,}/);
      const block = secMatch ? secMatch[1] : "";
      const lines = block.split("\n");
      const cpuHeaderRe = /^\s*CPU\s+(\d+)\s+(\d+)%\s*$/;
      const compRe = /^[ \t]+([A-Za-z][A-Za-z0-9_\-\/. ]*?)\s+(\d+)%\s*$/;

      const perCpu = [];
      let current = null;
      for (const line of lines) {
        const h = line.match(cpuHeaderRe);
        if (h) {
          if (current) perCpu.push(current);
          current = { cpu: `CPU ${h[1]}`, total: Number(h[2]), components: [] };
          continue;
        }
        if (current) {
          const c = line.match(compRe);
          if (c) current.components.push({ name: c[1].trim(), pct: Number(c[2]) });
        }
      }
      if (current) perCpu.push(current);
      if (!perCpu.length) return null;

      const agg = {};
      perCpu.forEach(cpu => cpu.components.forEach(c => {
        (agg[c.name] ||= []).push(c.pct);
      }));
      const compAvg = Object.entries(agg).map(([name, vals]) => ({
        name,
        avg: vals.reduce((a, b) => a + b, 0) / vals.length,
        max: Math.max(...vals),
        samples: vals.length,
      })).sort((a, b) => b.avg - a.avg);

      return { perCpu, compAvg };
    }

    // ── HTTP Worker Statistics ("HTTP Worker Statistics" 표) ──────────────────────
    // sysinfo 표에는 항상 아래 순서대로 28개의 "라벨: 숫자" 라인이 출력되므로,
    // 순서(위→아래) 기반으로 그대로 대입한다. Highwater(역대 최댓값)와
    // "idle time was..." 항목은 화면에서 제외한다.
    const HTTP_WORKER_ITEMS = [
      ["max_concurrent_client_workers", "Maximum acceptable concurrent client workers"],
      ["client_workers_created", "Currently created client workers"],
      ["http1_client_workers_active", "HTTP 1.x client workers currently active"],
      ["http1_client_workers_active_highwater", "active Highwater"],
      ["http1_client_workers_created_idle", "created (incl. idle persistent client workers)"],
      ["http1_client_workers_created_idle_highwater", "created Highwater (incl. idle persistent client workers)"],
      ["http2_client_connections_active", "HTTP 2 client connections currently active"],
      ["http2_client_connections_active_highwater", "active Highwater"],
      ["http2_client_connections_created_idle", "created (incl. idle connections)"],
      ["http2_client_connections_created_idle_highwater", "created Highwater (incl. idle connections)"],
      ["http2_client_streams_active", "HTTP 2 client streams currently active"],
      ["http2_client_streams_active_highwater", "active Highwater"],
      ["http1_server_workers_active", "HTTP 1.x server workers currently active"],
      ["http1_server_workers_active_highwater", "active Highwater"],
      ["http2_server_streams_active", "HTTP 2 server streams currently active"],
      ["http2_server_streams_active_highwater", "active Highwater"],
      ["http2_server_connections_active", "HTTP 2 server connections currently active"],
      ["http2_server_connections_active_highwater", "active Highwater"],
      ["http2_server_connections_created_idle", "created (incl. idle connections)"],
      ["http2_server_connections_created_idle_highwater", "created Highwater (incl. idle connections)"],
      ["http2_client_stream_contexts_created", "HTTP/2 client stream contexts currently created"],
      ["http2_server_stream_contexts_created", "HTTP/2 server stream contexts currently created"],
      ["persistent_client_conn_close_failed_idle_queue_empty", "Failed attempts to close persistent client conns (idle queue empty)"],
      ["persistent_client_conn_closed_idle_lt_2s", "Persistent client conns closed, idle < 2s"],
      ["persistent_client_conn_closed_idle_2_to_4s", "Persistent client conns closed, idle 2-4s"],
      ["persistent_client_conn_closed_idle_gt_4s", "Persistent client conns closed, idle > 4s"],
      ["server_persistent_conn_cache_max_size", "Max size of server-side persistent conn cache"],
      ["server_persistent_conn_cache_current_entries", "Current entries in server-side persistent conn cache"],
    ];

    function extractColonNumberLines(block) {
      const out = [];
      const re = /^_*\s*([A-Za-z][^:\n]*?)\s*:\s*(-?[\d,]+)\s*$/;
      for (const line of block.split("\n")) {
        const m = line.match(re);
        if (m) out.push([m[1].trim(), Number(m[2].replace(/,/g, ""))]);
      }
      return out;
    }

    function parseHttpWorkerStats(text) {
      const m = text.match(/HTTP Worker Statistics\s*\n([\s\S]*?)(?:\n[ \t]*\r?\n|_{10,}|$)/);
      if (!m) return null;
      const pairs = extractColonNumberLines(m[1]);
      if (!pairs.length) return null;

      const result = [];
      const len = Math.min(HTTP_WORKER_ITEMS.length, pairs.length);
      for (let i = 0; i < len; i++) {
        const [key, label] = HTTP_WORKER_ITEMS[i];
        if (/Highwater/i.test(label) || /when idle time was/i.test(label)) continue;
        result.push({ key, label, value: pairs[i][1] });
      }
      return result.length ? result : null;
    }

    // ── TCP/IP General / TCP Statistics ────────────────────────────────────────
    const TCP_GENERAL_ITEMS = [
      ["tcp_queue_entries", "Entries in TCP queue"],
      ["syns_ignored_accept_regulation", "Number of SYNs ignored due to acceptance regulation"],
      ["accept_regulations_high_cpu", "Number of accept regulations due to high CPU"],
    ];
    const TCP_STATS_ITEMS = [
      ["embryonic_connections_dropped", "Embryonic connections dropped"],
      ["connections_not_accepted_queue_full", "Connections not accepted because the queue was full"],
      ["tcp_time_wait_queue_entries", "Entries in TCP time wait queue"],
      ["packets_in_hold_queue", "Current number of packets in hold queue"],
      ["embryonic_connections_dropped_queue_overflow", "Embryonic connections dropped due to queue overflow"],
    ];

    function tcpSectionBlock(text, header) {
      const re = new RegExp(header.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\s*\\n([\\s\\S]*?)(?:\\n[ \\t]*\\n|_{10,}|$)");
      const m = text.match(re);
      return m ? m[1] : null;
    }

    function findLabelValue(block, labelSubstring) {
      if (!block) return null;
      const safe = labelSubstring.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const re = new RegExp(safe + "[^\\n]*?:?[ \\t]*(-?[\\d,]+)[^\\n]*$", "im");
      const m = block.match(re);
      return m ? Number(m[1].replace(/,/g, "")) : null;
    }

    function parseTcpStats(text) {
      const generalBlock = tcpSectionBlock(text, "TCP/IP General Statistics");
      const tcpBlock = tcpSectionBlock(text, "TCP/IP TCP Statistics");
      if (!generalBlock && !tcpBlock) return null;

      const general = TCP_GENERAL_ITEMS.map(([key, label]) => ({ key, label, value: findLabelValue(generalBlock, label) }));
      const tcp = TCP_STATS_ITEMS.map(([key, label]) => ({ key, label, value: findLabelValue(tcpBlock, label) }));
      return { general, tcp };
    }

    // ── Access Log Statistics (sysinfo에 반복 등장하는 "Access Log (xxx) Statistics" 블록) ──
    // 예전 버전은 "제목 줄 + 37번째 줄" 같은 위치 하드코딩이라 sysinfo 버전이 바뀌면
    // 깨지기 쉬웠다. AL_STATS_0007(현재 크기, byte)/AL_STATS_0009(최대 크기, MB)를
    // 각 로그 타입 블록 안에서 직접 정규식으로 찾아, main/ssl뿐 아니라 존재하는
    // 모든 로그 타입(streaming/dns 등)에 대해 자동으로 뽑는다.
    function bytesToReadable(n) {
      const units = [["TB", 1024 ** 4], ["GB", 1024 ** 3], ["MB", 1024 ** 2], ["KB", 1024]];
      for (const [unit, size] of units) {
        if (n >= size) return `${(n / size).toFixed(2)} ${unit}`;
      }
      return `${n.toFixed(0)} B`;
    }

    function parseAccessLogStats(text) {
      const titleRe = /Title:\s*Access Log \(([^)]+)\) Statistics/gi;
      const matches = [...text.matchAll(titleRe)];
      if (!matches.length) return null;

      const results = [];
      for (let i = 0; i < matches.length; i++) {
        const start = matches[i].index;
        const end = i + 1 < matches.length ? matches[i + 1].index : text.length;
        const block = text.slice(start, Math.min(end, start + 6000));
        const sizeMatch = block.match(/\bAL_STATS_0007\b[ \t]+(\d+)/);
        const maxMatch = block.match(/\bAL_STATS_0009\b[ \t]+(\d+)/);
        const currentBytes = sizeMatch ? Number(sizeMatch[1]) : null;
        const maxMB = maxMatch ? Number(maxMatch[1]) : null;
        const maxBytes = maxMB != null ? maxMB * 1000 * 1000 : null; // AL_STATS_0009 단위: MB(1000진법)
        const pct = (currentBytes != null && maxBytes) ? (currentBytes / maxBytes * 100) : null;
        results.push({
          type: matches[i][1].trim(),
          currentLabel: currentBytes != null ? bytesToReadable(currentBytes) : "-",
          maxLabel: maxBytes != null ? bytesToReadable(maxBytes) : "-",
          pct,
        });
      }
      return results;
    }

    const cpuMonitor = parseCpuMonitor(text);
    const httpWorkerStats = parseHttpWorkerStats(text);
    const tcpStats = parseTcpStats(text);
    const accessLogStats = parseAccessLogStats(text);

    // 사용률(%)에 따른 색상 클래스 (기존 nok/yellow/red 스타일 재사용)
    function pctClass(pct) {
      if (pct == null) return "";
      if (pct >= 90) return 'class="red"';
      if (pct >= 70) return 'class="yellow"';
      return "";
    }

    // ── 파일별 상세 진단 정보 블록(HTML) 생성 ──────────────────────────────────
    function buildDetailBlock(fileName) {
      let cpuHtml = '<p style="padding:8px 10px;color:#888;">CPU Monitor 데이터를 찾지 못했습니다.</p>';
      if (cpuMonitor) {
        const coreRows = cpuMonitor.perCpu.map(c =>
          `<tr><td>${c.cpu}</td><td ${pctClass(c.total)}>${c.total}%</td></tr>`
        ).join("");
        const compRows = cpuMonitor.compAvg.slice(0, 8).map(c =>
          `<tr><td>${c.name}</td><td>${c.avg.toFixed(1)}%</td><td>${c.max}%</td><td>${c.samples}</td></tr>`
        ).join("");
        cpuHtml = `
          <div style="display:flex; gap:16px; flex-wrap:wrap;">
            <table style="width:auto; min-width:160px;">
              <tr><th>코어</th><th>사용률</th></tr>
              ${coreRows}
            </table>
            <table style="width:auto; min-width:320px;">
              <tr><th>컴포넌트(프로세스 그룹)</th><th>평균</th><th>최대</th><th>코어 수</th></tr>
              ${compRows}
            </table>
          </div>`;
      }

      let httpHtml = '<p style="padding:8px 10px;color:#888;">HTTP Worker Statistics 데이터를 찾지 못했습니다.</p>';
      if (httpWorkerStats) {
        const rows = httpWorkerStats.map(i => `<tr><td style="text-align:left;">${i.label}</td><td>${i.value}</td></tr>`).join("");
        httpHtml = `<table><tr><th>항목</th><th>값</th></tr>${rows}</table>`;
      }

      let tcpHtml = '<p style="padding:8px 10px;color:#888;">TCP/IP Statistics 데이터를 찾지 못했습니다.</p>';
      if (tcpStats) {
        const rows = [...tcpStats.general, ...tcpStats.tcp]
          .map(i => `<tr><td style="text-align:left;">${i.label}</td><td>${i.value ?? "-"}</td></tr>`).join("");
        tcpHtml = `<table><tr><th>항목</th><th>값</th></tr>${rows}</table>`;
      }

      let alHtml = '<p style="padding:8px 10px;color:#888;">Access Log Statistics 데이터를 찾지 못했습니다.</p>';
      if (accessLogStats) {
        const rows = accessLogStats.map(a =>
          `<tr><td>${a.type}</td><td>${a.currentLabel}</td><td>${a.maxLabel}</td><td ${pctClass(a.pct)}>${a.pct != null ? a.pct.toFixed(1) + "%" : "-"}</td></tr>`
        ).join("");
        alHtml = `<table><tr><th>로그 종류</th><th>현재 크기</th><th>저장 최대 크기</th><th>사용률</th></tr>${rows}</table>`;
      }

      return `
        <details class="diag">
          <summary>🔧 ${fileName} — 상세 진단 정보 (CPU Monitor / HTTP Worker / TCP·IP / Access Log)</summary>
          <div class="diag-body">
            <h4 class="diag-h">CPU Monitor</h4>
            ${cpuHtml}
            <h4 class="diag-h">HTTP Worker Statistics</h4>
            ${httpHtml}
            <h4 class="diag-h">TCP/IP Statistics</h4>
            ${tcpHtml}
            <h4 class="diag-h">Access Log Statistics (전체 로그 타입)</h4>
            ${alHtml}
          </div>
        </details>`;
    }

    const section5 = buildDetailBlock(file.name);

    // =======================================================================================
    // 0-2. 트렌드(시계열) 데이터 추출 — CPU/메모리 사용률, 네트워크 처리량
    //    sysinfo 라인 포맷: <key>~<granularity>@<날짜> UTC[offset](count, interval): v1 v2 v3 ...
    //    이미 ②번 표에서 Now/Peak 값만 뽑아 쓰던 바로 그 시계열 원본을, 값 하나만
    //    꺼내는 대신 전체 구간 + 타임스탬프까지 복원해서 그래프로 그린다.
    // =======================================================================================
    function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

    const MONTH_IDX = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };
    function parseSysinfoDate(s) {
      const m = s.match(/^[A-Za-z]{3}, (\d{1,2}) ([A-Za-z]{3}) (\d{4}) (\d{2}):(\d{2}):(\d{2})$/);
      if (!m) return null;
      const [, day, mon, year, hh, mi, ss] = m;
      if (!(mon in MONTH_IDX)) return null;
      return new Date(Date.UTC(Number(year), MONTH_IDX[mon], Number(day), Number(hh), Number(mi), Number(ss)));
    }

    // key~granularity@date UTC[offset](count, interval): v1 v2 ... 라인 하나를 찾아
    // {timestamps, values, interval, granularity}로 변환한다. 못 찾으면 null.
    function parseSeriesLine(text, keyLiteral, granularity) {
      const pattern = new RegExp(
        "^" + escapeRegex(keyLiteral) + "~" + escapeRegex(granularity) + "@" +
        "([A-Za-z]{3}, \\d{1,2} [A-Za-z]{3} \\d{4} \\d{2}:\\d{2}:\\d{2}) UTC" +
        "\\[(\\d+)\\]\\((\\d+),\\s*(\\d+)\\):\\s*([0-9.\\s-]+)\\s*$",
        "m"
      );
      const m = text.match(pattern);
      if (!m) return null;
      const endDate = parseSysinfoDate(m[1]);
      if (!endDate) return null;
      const interval = Number(m[4]);
      const values = m[5].trim().split(/\s+/).map(Number).filter(v => !Number.isNaN(v));
      const count = values.length;
      if (!count) return null;
      // j번째(과거→현재) 값의 시각 = endDate - interval * (count - 1 - j)
      const timestamps = values.map((_, i) => new Date(endDate.getTime() - interval * 1000 * (count - 1 - i)));
      return { timestamps, values, interval, granularity };
    }

    // 후보 granularity를 순서대로 시도해 먼저 찾아지는 것을 반환한다.
    function parseSeriesAny(text, keyLiteral, granularities) {
      for (const g of granularities) {
        const r = parseSeriesLine(text, keyLiteral, g);
        if (r) return r;
      }
      return null;
    }

    // CPU / Memory 사용률(%) 추이 — Now/Peak 계산에 쓰던 것과 동일한 granularity 우선순위(hourly → daily)
    const cpuSeries = parseSeriesAny(text, "system:cpu-usage", ["hourly", "daily"]);
    const memSeries = parseSeriesAny(text, "system:memory-usage", ["hourly", "daily"]);

    // 네트워크 Tx/Rx 추이 — calcRate()와 동일한 방식(daily15minute)으로 후보 인터페이스를 순회해
    // 평균 트래픽이 가장 큰 인터페이스 하나를 골라 그 인터페이스의 Tx/Rx 시계열을 사용한다.
    function findBestTrafficInterface(text) {
      let best = null, bestAvg = -1, bestSent = null, bestRecv = null;
      // Tx/Rx Rate 계산 대상과 동일: 0:0~4:3 + 9:0~9:9
      const candidates = [];
      for (let i = 0; i <= 4; i++) {
        for (let j = 0; j <= 3; j++) candidates.push(`${i}:${j}`);
      }
      for (let j = 0; j <= 9; j++) candidates.push(`9:${j}`);

      for (const iface of candidates) {
        const sent = parseSeriesLine(text, `tcpip:interface:${iface}:bytes-sent`, "daily15minute");
        const recv = parseSeriesLine(text, `tcpip:interface:${iface}:bytes-received`, "daily15minute");
        if (!sent && !recv) continue;
        const avgOf = (s) => s ? s.values.reduce((a, b) => a + b, 0) / s.values.length : 0;
        const avg = avgOf(sent) + avgOf(recv);
        if (avg > bestAvg) { bestAvg = avg; best = iface; bestSent = sent; bestRecv = recv; }
      }
      return best ? { iface: best, sent: bestSent, recv: bestRecv } : null;
    }
    const netTraffic = findBestTrafficInterface(text);

    // byte(구간 합계) → Mbps(순간 전송률) 변환: bits = bytes*8, 구간(초)으로 나눔
    function seriesToMbps(series) {
      if (!series) return null;
      return {
        timestamps: series.timestamps,
        values: series.values.map(v => (v * 8) / series.interval / 1_000_000),
      };
    }
    const netSentMbps = netTraffic ? seriesToMbps(netTraffic.sent) : null;
    const netRecvMbps = netTraffic ? seriesToMbps(netTraffic.recv) : null;

    const hasCpuMemChart = !!(cpuSeries || memSeries);
    const hasNetChart = !!(netSentMbps || netRecvMbps);

    const section6 = (hasCpuMemChart || hasNetChart) ? `
        <details class="diag" open>
          <summary>📈 ${file.name} — 트렌드 그래프</summary>
          <div class="diag-body">
            ${hasCpuMemChart ? `
            <h4 class="diag-h">CPU / Memory 사용률 추이 (%)</h4>
            <div style="position:relative; height:260px; max-width:900px;"><canvas id="chart-cpumem-${fileIdx}"></canvas></div>` : ""}
            ${hasNetChart ? `
            <h4 class="diag-h">네트워크 처리량 추이 — Interface ${netTraffic ? netTraffic.iface : "-"} (Mbps)</h4>
            <div style="position:relative; height:260px; max-width:900px;"><canvas id="chart-net-${fileIdx}"></canvas></div>` : ""}
            ${(!hasCpuMemChart && !hasNetChart) ? '<p style="color:#888;">그래프로 그릴 수 있는 시계열 데이터를 찾지 못했습니다.</p>' : ""}
          </div>
        </details>` : "";

    // 나중에 report DOM에 캔버스가 실제로 삽입된 뒤 Chart.js로 그리기 위해 전역 배열에 적재해둔다.
    window.__sysinfoTrendCharts = window.__sysinfoTrendCharts || [];
    window.__sysinfoTrendCharts.push({
      idx: fileIdx,
      cpuSeries, memSeries,
      netSentMbps, netRecvMbps,

    // Web Filtering Database 확인

    // AL_STATS_0026(로그 상태) / AL_STATS_0027(로그 크기) 값을 함께 확인하여

    //    "Title: Access Log (...) Statistics" 섹션을 순회하면서

    let httpLog = "-";

      const isHttpsCategory = /https|ssl/i.test(sectionName) || /https|ssl/i.test(statusValue);

  // HTML 다운로드 버튼 기능
  // =======================================================================================
  document.getElementById("downloadBtn").addEventListener("click", function () {
    // 저장본의 전체 원문은 복제 DOM에만 삽입, 화면 렌더링과 분리한다.
    const snapshot = document.documentElement.cloneNode(true);
    const cache = window.__sysinfoRawContent || [];
    snapshot.querySelectorAll(".raw-block[data-raw-id], .raw-subsection[data-raw-id]").forEach(details => {
      const content = details.querySelector(":scope > .raw-block-content");
      if (!content) return;
      const source = cache[Number(details.dataset.rawId)];
      if (typeof source !== "string") return;
      const pre = document.createElement("pre");
      pre.textContent = source;
      content.replaceChildren(pre);
      content.hidden = false;
      content.dataset.loaded = "1";
    });
    const fullHTML = "<!DOCTYPE html>\n" + snapshot.outerHTML;
    const blob = new Blob([fullHTML], { type: "text/html" });

    // 오늘 날짜 기반 파일명
    const date = new Date();
    const yyyy = date.getFullYear();
    const mm = String(date.getMonth() + 1).padStart(2, "0");
    const dd = String(date.getDate()).padStart(2, "0");
    const fileName = `ProxySG_Report_${yyyy}${mm}${dd}.html`;

    // 다운로드 링크 생성 및 실행
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = fileName;
    a.click();

    // 메모리 해제
    URL.revokeObjectURL(a.href);
  });
  
  
  

</script>

<script>
  // === 드래그 앤 드롭 기능 추가 ===
  const dropZone = document.getElementById("dropZone");

  // 기본 이벤트 막기 + 드래그 시 스타일 변경
  ["dragenter", "dragover"].forEach(eventName => {
    dropZone.addEventListener(eventName, (e) => {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.add("dragover");
    });
  });

  // 드래그 종료 시 스타일 복구
  ["dragleave", "drop"].forEach(eventName => {
    dropZone.addEventListener(eventName, (e) => {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.remove("dragover");
    });
  });

  // 드롭 시 파일 처리
  dropZone.addEventListener("drop", (e) => {
    const files = e.dataTransfer.files;
    if (files.length > 0) {
      // input의 change 이벤트와 동일하게 실행
      document.getElementById("fileInput").files = files;
      const event = new Event("change");
      document.getElementById("fileInput").dispatchEvent(event);
    }
  });

  // 선택된 파일 안내 문구 + 드롭 영역 클릭/키보드로 파일 선택창 열기
  const fileInputEl = document.getElementById("fileInput");
  const fileHintEl = document.getElementById("fileHint");
  fileInputEl.addEventListener("change", () => {
    const n = fileInputEl.files ? fileInputEl.files.length : 0;
    fileHintEl.textContent = n === 0 ? "선택된 파일 없음"
      : n === 1 ? fileInputEl.files[0].name
      : `${n}개 파일 선택됨`;
    // 파일이 올라오면 상단 업로드 패널을 한 줄로 줄인다
    document.querySelector(".upload-panel").classList.toggle("compact", n > 0);
  });
  dropZone.addEventListener("click", () => fileInputEl.click());
  dropZone.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInputEl.click(); }
  });
</script>

<div id="modalOverlay" class="modal-overlay">

    <!-- === 실제 Sysinfo curl 생성기 HTML 삽입 === -->
    <div class="container">
      <h2>Sysinfo curl 명령어 생성기 <span class="badge">마지막만 explorer 실행</span></h2>

          <label>Username</label>

          <label>Path</label>

        </div>
      </div>

      <label>생성된 curl 명령</label>
      <pre id="cmds"></pre>

      <div class="actions">
        <button id="copy">전체 복사</button>
        <span class="note">📂 마지막 다운로드 완료 후에만 폴더가 열립니다.</span>
      </div>

  </div>
</div>

<script>
  // === 모달 제어 ===
  const openModal = document.getElementById("openModal");
  const modalOverlay = document.getElementById("modalOverlay");
  const closeBtn = document.querySelector(".close-btn");

  openModal.addEventListener("click", () => modalOverlay.style.display = "flex");
  closeBtn.addEventListener("click", () => modalOverlay.style.display = "none");
  modalOverlay.addEventListener("click", e => { if (e.target === modalOverlay) modalOverlay.style.display = "none"; });
  document.addEventListener("keydown", e => { if (e.key === "Escape") modalOverlay.style.display = "none"; });

  // === curl 생성기 로직 ===
  (function(){
    const username=document.getElementById('username');
    const password=document.getElementById('password');
    const proxyList=document.getElementById('proxyList');
    const endpoint=document.getElementById('endpoint');
    const cmdsEl=document.getElementById('cmds');
    const copyBtn=document.getElementById('copy');

    function pad(n){return n<10?'0'+n:n;}
    function yyyymmdd(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());}
    function tailForFilename(host){
      if(!host)return'ip';
      try{
        let h=host.trim().replace(/^https?:\/\//i,'').replace(/\/.*$/,'');
        if(h.includes(':'))h=h.split(':')[0];
        const parts=h.split('.');
        const last=parts[parts.length-1];
        if(/^\d+$/.test(last))return last;
        return h.replace(/[^0-9a-zA-Z]/g,'_').slice(0,15)||'host';
      }catch{return'ip';}
    }
    function parseHosts(raw){return raw.split(/[, \t\r\n]+/).map(x=>x.trim()).filter(Boolean);}
    function buildCommands(){
      const u=username.value.trim(), p=password.value;
      const ep=endpoint.value.trim()||'/sysinfo';
      const epFinal=ep.startsWith('/')?ep:'/'+ep;
      const hosts=parseHosts(proxyList.value);
      const date=yyyymmdd(new Date());
      const cmds=[];
      hosts.forEach((h, idx)=>{
        const tail=tailForFilename(h);
        const filename=`sysinfo_${tail}_${date}.txt`;
        const cred=(u||p)?`${u}:${p}`:'';
        const credPart=cred?`-u ${cred} `:'';
        const explorerPart=(idx===hosts.length-1)?" && explorer .":"";
        cmds.push(`curl -k ${credPart}https://${h}:8082${epFinal} -o ${filename}${explorerPart}`);
      });
      return cmds;
    }
    function refresh(){
      const cmds=buildCommands();
      cmdsEl.textContent=cmds.length?cmds.join('\n'):'# IP/Host를 입력하세요';
    }
    [username,password,proxyList,endpoint].forEach(e=>e.addEventListener('input',refresh));
    refresh();
    copyBtn.onclick=async()=>{
      try{
        await navigator.clipboard.writeText(cmdsEl.textContent);
        copyBtn.textContent='복사됨 ✓';
        setTimeout(()=>copyBtn.textContent='전체 복사',1500);
      }catch{alert('복사 실패');}
    };
  })();
</script>
